[project]
name = "catalog-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "mcp==2.3.0",
  "mcp-types==2.3.0",
  "azure-core==1.41.0",
  "azure-identity==1.25.3",
  "PyJWT[crypto]==2.15.0",
  "pydantic==2.13.5",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
  "azure-monitor-opentelemetry==1.8.9",
  "opentelemetry-instrumentation-asgi==0.64b0",
  "opentelemetry-api==1.43.0",
  "opentelemetry-sdk==1.43.0",
  "mise==2.7.0",
  "icukit-pyicu==78.3.0; sys_platform == 'linux'",
  "azure-data-tables==12.7.0",
]

[tool.uv]
find-links = ["wheelhouse"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "catalog_app"
module-root = "src"
