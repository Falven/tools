<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Click Counter</title>
  <style>
    :root {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--color-text-primary, #172033);
      background: var(--color-background-primary, #f7f8fc);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      text-align: center;
      border: 1px solid var(--color-border-secondary, #dce1ec);
      border-radius: 20px;
      background: var(--color-background-secondary, #ffffff);
      box-shadow: 0 16px 40px rgba(30, 45, 80, 0.10);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-text-secondary, #667085);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2rem);
    }

    output {
      display: block;
      margin: 22px 0;
      font-size: clamp(3.5rem, 18vw, 6rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--color-accent, #5b5bd6);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-width: 110px;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #increment {
      color: #ffffff;
      background: var(--color-accent, #5b5bd6);
    }

    #reset {
      color: var(--color-text-primary, #172033);
      background: var(--color-background-tertiary, #eef1f7);
    }

    button:hover {
      filter: brightness(0.96);
    }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--color-accent, #5b5bd6) 40%, transparent);
      outline-offset: 3px;
    }

    .hint {
      margin: 18px 0 0;
      color: var(--color-text-secondary, #667085);
      font-size: 0.85rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color: #f4f6fb;
        background: #111522;
      }

      main {
        border-color: #30384d;
        background: #191f2f;
        box-shadow: none;
      }

      .eyebrow,
      .hint {
        color: #aab3c7;
      }

      #reset {
        color: #f4f6fb;
        background: #30384d;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="eyebrow">MCP App</p>
    <h1 id="title">Click Counter</h1>
    <output id="count" aria-live="polite">0</output>
    <div class="actions">
      <button id="increment" type="button">Count +1</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <p class="hint">Counter state stays inside this app.</p>
  </main>

  <script>
    (() => {
      let count = 0;
      const output = document.getElementById("count");

      function render() {
        output.value = String(count);
        output.textContent = String(count);
      }

      document.getElementById("increment").addEventListener("click", () => {
        count += 1;
        render();
      });

      document.getElementById("reset").addEventListener("click", () => {
        count = 0;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
