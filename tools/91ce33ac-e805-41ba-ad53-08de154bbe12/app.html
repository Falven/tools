<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #151515;
        --panel: #242424;
        --border: #4a4a4a;
        --text: #f4f4f4;
        --muted: #b8b8b8;
        --accent: #ef4444;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; overscroll-behavior: none; }

      body {
        min-height: 100vh;
        padding: 16px;
        color: var(--text);
        background: var(--bg);
        font: 600 14px/1.35 Arial, Helvetica, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      button { font: inherit; }
      .app { width: min(100%, 650px); margin: 0 auto; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: .14em;
      }

      .header-actions { display: flex; gap: 8px; }

      .button {
        min-height: 40px;
        padding: 0 13px;
        border: 2px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        background: var(--panel);
        cursor: pointer;
      }

      .button:hover { border-color: #777; }
      .button:active { transform: translateY(1px); }
      .icon-button { min-width: 42px; font-size: 17px; }

      .game-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 150px;
        gap: 12px;
        align-items: start;
      }

      .board-shell {
        position: relative;
        width: min(100%, 400px);
        justify-self: end;
        padding: 6px;
        border: 3px solid #777;
        border-radius: 3px;
        background: #0a0a0a;
      }

      #board {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 2;
        background: #090909;
      }

      .overlay {
        position: absolute;
        inset: 6px;
        z-index: 3;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, .82);
        opacity: 0;
        pointer-events: none;
      }

      .overlay.show { opacity: 1; pointer-events: auto; }

      .overlay-card {
        width: min(84%, 260px);
        padding: 22px 18px;
        border: 2px solid #777;
        text-align: center;
        background: #202020;
      }

      .overlay-card .eyebrow {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .overlay-card h2 {
        margin: 7px 0;
        font-size: 25px;
        text-transform: uppercase;
      }

      .overlay-card p { margin: 0 0 16px; color: var(--muted); font-size: 12px; }

      .primary {
        width: 100%;
        padding: 11px 14px;
        border: 0;
        border-radius: 3px;
        color: white;
        background: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
      }

      .sidebar { display: grid; gap: 10px; }

      .panel {
        padding: 12px;
        border: 2px solid var(--border);
        border-radius: 3px;
        background: var(--panel);
      }

      .label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .score-value {
        margin-top: 3px;
        font-size: 25px;
        font-variant-numeric: tabular-nums;
      }

      .best { margin-top: 4px; color: #facc15; font-size: 11px; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat strong { display: block; margin-top: 2px; font-size: 18px; }
      #next { display: block; width: 100%; margin-top: 5px; aspect-ratio: 1.6; }
      .keys { display: grid; gap: 7px; color: var(--muted); font-size: 10px; }
      .key-row { display: flex; justify-content: space-between; gap: 8px; }

      kbd {
        min-width: 21px;
        padding: 2px 5px;
        border: 1px solid #666;
        border-bottom-width: 2px;
        border-radius: 3px;
        color: white;
        background: #333;
        font: 700 9px Arial, sans-serif;
        text-align: center;
      }

      .mobile-stats {
        display: none;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 8px;
      }

      .mobile-stat {
        padding: 7px 4px;
        border: 2px solid var(--border);
        border-radius: 3px;
        text-align: center;
        background: var(--panel);
      }

      .mobile-stat strong { display: block; margin-top: 2px; font-size: 15px; }

      .controls {
        display: none;
        grid-template-columns: 1fr 1fr 1fr 1.2fr;
        gap: 7px;
        width: min(100%, 360px);
        margin: 10px auto 0;
      }

      .control {
        min-height: 48px;
        border: 2px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        background: var(--panel);
        font-size: 18px;
        font-weight: 800;
      }

      .control.hard { border-color: var(--accent); background: var(--accent); }
      .control:active { transform: translateY(1px); filter: brightness(1.15); }

      .status {
        min-height: 18px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 10px;
        text-align: center;
      }

      dialog {
        width: min(calc(100% - 28px), 560px);
        max-height: min(78vh, 650px);
        padding: 0;
        border: 3px solid #777;
        border-radius: 4px;
        color: var(--text);
        background: #1d1d1d;
        box-shadow: 0 20px 80px rgba(0,0,0,.65);
        user-select: text;
        -webkit-user-select: text;
      }

      dialog::backdrop { background: rgba(0,0,0,.75); }

      .scores-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 2px solid var(--border);
        background: #1d1d1d;
      }

      .scores-header h2 { margin: 0; font-size: 19px; letter-spacing: .08em; }
      .close { min-width: 36px; min-height: 34px; padding: 0; }
      .scores-body { max-height: calc(78vh - 64px); overflow: auto; padding: 8px 16px 16px; }

      .score-row {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 10px 4px;
        border-bottom: 1px solid #3b3b3b;
      }

      .rank { color: #facc15; text-align: center; }
      .player { min-width: 0; }
      .player-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .player-email { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .leader-score { font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; }
      .leader-lines { color: var(--muted); font-size: 10px; text-align: right; }
      .empty { padding: 30px 10px; color: var(--muted); text-align: center; }

      @media (max-width: 560px), (pointer: coarse) {
        body { padding: 10px; }
        h1 { font-size: 22px; }
        .button { padding: 0 10px; font-size: 12px; }
        .game-layout { display: block; }
        .sidebar { display: none; }
        .mobile-stats { display: grid; }
        .board-shell { width: min(100%, 350px); margin: 0 auto; }
        .controls { display: grid; }
      }

      @media (max-height: 700px) and (pointer: coarse) {
        body { padding-top: 7px; }
        header { margin-bottom: 6px; }
        .mobile-stats { margin-bottom: 5px; }
        .mobile-stat { padding: 4px; }
        .board-shell { width: min(100%, 270px); }
        .controls { margin-top: 6px; }
        .control { min-height: 40px; }
        .status { margin-top: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-label="Tetris game">
      <header>
        <h1>TETRIS</h1>
        <div class="header-actions">
          <button id="high-scores" class="button" type="button">High Scores</button>
          <button id="pause" class="button icon-button" type="button" aria-label="Pause game" title="Pause (P)">Ⅱ</button>
        </div>
      </header>

      <section class="mobile-stats" aria-label="Game statistics">
        <div class="mobile-stat"><span class="label">Score</span><strong data-score>0</strong></div>
        <div class="mobile-stat"><span class="label">Best</span><strong data-best>0</strong></div>
        <div class="mobile-stat"><span class="label">Lines</span><strong data-lines>0</strong></div>
        <div class="mobile-stat"><span class="label">Level</span><strong data-level>1</strong></div>
      </section>

      <div class="game-layout">
        <div class="board-shell" id="touch-zone">
          <canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-card">
              <div id="overlay-eyebrow" class="eyebrow">Game paused</div>
              <h2 id="overlay-title">Paused</h2>
              <p id="overlay-copy">Your game is paused.</p>
              <button id="overlay-action" class="primary" type="button">Resume</button>
            </div>
          </div>
        </div>

        <aside class="sidebar" aria-label="Game information">
          <div class="panel">
            <div class="label">Score</div>
            <div class="score-value" data-score>0</div>
            <div class="best">BEST <span data-best>0</span></div>
          </div>
          <div class="panel stats">
            <div class="stat"><span class="label">Lines</span><strong data-lines>0</strong></div>
            <div class="stat"><span class="label">Level</span><strong data-level>1</strong></div>
          </div>
          <div class="panel">
            <div class="label">Next</div>
            <canvas id="next" width="160" height="100" aria-label="Next piece"></canvas>
          </div>
          <div class="panel keys" aria-label="Keyboard controls">
            <div class="key-row"><span>Move</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
            <div class="key-row"><span>Rotate</span><span><kbd>↑</kbd></span></div>
            <div class="key-row"><span>Soft drop</span><span><kbd>↓</kbd></span></div>
            <div class="key-row"><span>Hard drop</span><span><kbd>Space</kbd></span></div>
            <div class="key-row"><span>Pause</span><span><kbd>P</kbd></span></div>
          </div>
        </aside>
      </div>

      <div class="controls" aria-label="Touch controls">
        <button class="control" type="button" data-action="left" aria-label="Move left">←</button>
        <button class="control" type="button" data-action="rotate" aria-label="Rotate">↻</button>
        <button class="control" type="button" data-action="right" aria-label="Move right">→</button>
        <button class="control hard" type="button" data-action="drop" aria-label="Hard drop">⇊</button>
      </div>
      <div id="status" class="status" role="status">Arrow keys to move · Space to drop</div>
    </main>

    <dialog id="scores-dialog">
      <div class="scores-header">
        <h2>HIGH SCORES</h2>
        <button id="close-scores" class="button close" type="button" aria-label="Close">×</button>
      </div>
      <div class="scores-body">
        <div id="scores-list" class="empty">Loading…</div>
      </div>
    </dialog>
    <!-- app.js -->
  </body>
</html>
