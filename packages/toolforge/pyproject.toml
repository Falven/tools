[project]
name = "toolforge"
version = "23.0.1"
requires-python = ">=3.13"
dependencies = ["mcp==2.0.0", "azure-identity==1.25.3", "PyJWT[crypto]==2.15.0"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "toolforge"
module-root = "src"
