<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Celsius to Fahrenheit</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --card: #ffffff;
      --ink: #17263f;
      --muted: #52617a;
      --line: #d6dfec;
      --accent: #2457cc;
      --accent-hover: #1d46a6;
      --soft: #edf3ff;
      --error: #b32635;
    }
    :root[data-theme="dark"] {
      --page: #101827; --card: #182438; --ink: #eff4ff; --muted: #b2bfd6;
      --line: #40516d; --accent: #95b8ff; --accent-hover: #bed3ff;
      --soft: #203554; --error: #ffabb4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page: #101827; --card: #182438; --ink: #eff4ff; --muted: #b2bfd6;
        --line: #40516d; --accent: #95b8ff; --accent-hover: #bed3ff;
        --soft: #203554; --error: #ffabb4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: clamp(16px, 4vw, 32px);
      background: var(--page); color: var(--ink);
      font: 15px/1.5 var(--font-sans, ui-sans-serif, system-ui, -apple-system, sans-serif);
    }
    main {
      width: 100%; max-width: 520px; margin: 0 auto; padding: clamp(20px, 5vw, 32px);
      background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .icon { flex: 0 0 44px; width: 44px; height: 44px; padding: 10px; background: var(--soft); color: var(--accent); border-radius: 14px; }
    .eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(19px, 4.6vw, 24px); line-height: 1.25; letter-spacing: -.035em; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    .input-wrap { position: relative; }
    input {
      display: block; width: 100%; min-width: 0; padding: 13px 58px 13px 16px;
      background: var(--card); color: var(--ink); border: 1.5px solid var(--line);
      border-radius: 12px; font: inherit; font-size: 24px; font-variant-numeric: tabular-nums;
    }
    .unit { position: absolute; top: 50%; right: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .hint { margin: 8px 0 16px; font-size: 12px; color: var(--muted); }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    :is(input, button):focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    input[aria-invalid="true"] { border-color: var(--error); }
    button:disabled, input:disabled { cursor: default; opacity: .6; }
    #convert {
      width: 100%; min-height: 48px; padding: 12px 16px; border: 0; border-radius: 12px;
      font-weight: 650; background: var(--accent); color: var(--card);
    }
    #convert:hover:not(:disabled) { background: var(--accent-hover); }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 22px; }
    .presets button {
      flex: 1 1 auto; padding: 8px 10px; min-height: 40px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--card); color: var(--muted); font-size: 12px;
    }
    .presets button:hover:not(:disabled) { color: var(--accent); background: var(--soft); border-color: var(--accent); }
    .result { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .result-label { margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    output { display: block; margin: 5px 0; color: var(--accent); font-size: clamp(36px, 10vw, 52px); font-weight: 650; letter-spacing: -.05em; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .result-unit { font-size: .55em; letter-spacing: -.02em; }
    #equation { margin: 5px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    #status { margin: 12px 0 0; min-height: 22px; color: var(--muted); font-size: 13px; }
    #status[data-error="true"] { color: var(--error); }
    footer { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 16px; color: var(--muted); font-size: 12px; text-align: center; }
    .formula { margin: 0; font-weight: 600; }
    .privacy { margin: 5px 0 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M9 14.5V5a3 3 0 0 1 6 0v9.5a5 5 0 1 1-6 0Z" />
        <path d="M12 8v10m-2 0h4M18 5h3m-3 4h2" stroke-linecap="round" />
      </svg>
      <div><p class="eyebrow">Temperature converter</p><h1>Celsius to Fahrenheit</h1></div>
    </header>
    <form id="converter" novalidate>
      <label for="celsius">Celsius</label>
      <div class="input-wrap">
        <input id="celsius" name="celsius" type="number" step="any" value="0" required inputmode="decimal" autocomplete="off" aria-describedby="input-hint status" disabled />
        <span class="unit" aria-hidden="true">°C</span>
      </div>
      <p id="input-hint" class="hint">Enter a number, including negatives or decimals.</p>
      <button id="convert" type="submit" disabled>Convert to Fahrenheit <span aria-hidden="true">→</span></button>
      <div class="presets" role="group" aria-label="Quick temperatures">
        <button type="button" data-celsius="0" disabled>Freezing · 0 °C</button>
        <button type="button" data-celsius="20" disabled>Room · 20 °C</button>
        <button type="button" data-celsius="100" disabled>Boiling · 100 °C</button>
      </div>
    </form>
    <section class="result" aria-label="Conversion result">
      <p class="result-label">Fahrenheit</p>
      <output id="result" for="celsius" aria-live="polite" aria-atomic="true"><span id="fahrenheit">—</span> <span class="result-unit">°F</span></output>
      <p id="equation">Your converted temperature will appear here.</p>
    </section>
    <p id="status" role="status" aria-live="polite">Connecting to the app host…</p>
    <footer>
      <p class="formula">°F = °C × 9/5 + 32</p>
      <p class="privacy">No conversion history is stored by this tool.</p>
    </footer>
    <noscript>JavaScript is required for the interactive converter. Use the tool's text result instead.</noscript>
  </main>
  <!-- app.js -->
</body>
</html>
